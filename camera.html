<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Kamera Selfie Absensi</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:14px;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}
    .wrap{max-width:520px;margin:auto}
    .card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 15px 45px rgba(15,23,42,.16)}
    .head{padding:18px;background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;text-align:center}
    .head h1{margin:0;font-size:22px}.head p{margin:7px 0 0}
    .body{padding:16px}
    video{width:100%;display:block;background:#020617;border-radius:18px;min-height:300px;max-height:65vh;object-fit:cover;transform:scaleX(-1)}
    canvas{display:none}
    button{width:100%;border:0;border-radius:16px;padding:16px;margin-top:12px;font-size:18px;font-weight:800}
    .primary{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff}
    .light{background:#e2e8f0;color:#0f172a}
    .danger{background:#dc2626;color:#fff}
    .status{margin-top:12px;padding:13px;border-radius:14px;background:#f1f5f9;font-weight:700;line-height:1.45}
    .success{background:#dcfce7;color:#166534}.warning{background:#fef3c7;color:#92400e}
    .note{font-size:13px;color:#64748b;line-height:1.45;text-align:center;margin-top:10px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <h1>📷 KAMERA SELFIE</h1>
      <p>Silakan izinkan akses Kamera</p>
    </div>
    <div class="body">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <button id="ambil" class="primary" disabled>Ambil Selfie</button>
      <button id="ulang" class="light" onclick="mulaiKamera()">Muat Ulang Kamera</button>
      <button class="danger" onclick="tutup()">Tutup</button>
      <div id="status" class="status">Meminta izin kamera...</div>
      <div class="note">Jika muncul pertanyaan kamera, pilih <b>Allow / Izinkan</b>.</div>
    </div>
  </div>
</div>

<script>
"use strict";
let stream = null;

window.addEventListener("load", mulaiKamera);
window.addEventListener("pagehide", stop);

async function mulaiKamera(){
  const video=document.getElementById("video");
  const ambil=document.getElementById("ambil");
  ambil.disabled=true;
  setStatus("📷 Meminta izin Kamera... Pilih Allow / Izinkan.", "");

  try{
    stop();

    if(!window.isSecureContext){
      throw new Error("Halaman kamera harus HTTPS.");
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("Browser tidak mendukung akses kamera.");
    }

    try{
      stream=await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{
          facingMode:{ideal:"user"},
          width:{ideal:1280},
          height:{ideal:720}
        }
      });
    }catch(e){
      if(e && e.name==="NotAllowedError") throw e;
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true});
    }

    video.srcObject=stream;
    video.muted=true;
    video.setAttribute("playsinline","");
    await video.play();

    ambil.disabled=false;
    setStatus("✅ Kamera aktif. Silakan tekan Ambil Selfie.","success");
  }catch(e){
    const msg=errorMessage(e);
    setStatus("⚠️ "+msg,"warning");
    kirimError(msg);
  }
}

function ambilSelfie(){
  const video=document.getElementById("video");
  const canvas=document.getElementById("canvas");

  if(!video.videoWidth || !video.videoHeight){
    setStatus("Kamera belum siap. Tunggu sebentar.","warning");
    return;
  }

  let w=video.videoWidth,h=video.videoHeight;
  const max=900;
  if(w>max){h=Math.round(h*max/w);w=max;}

  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d",{alpha:false});
  ctx.save();
  ctx.translate(w,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0,w,h);
  ctx.restore();

  const fotoData=canvas.toDataURL("image/jpeg",0.68);

  if(window.opener && !window.opener.closed){
    window.opener.postMessage({
      type:"ABSEN_SELFIE_CAPTURED",
      fotoData:fotoData
    },"*");

    setStatus("✅ Selfie berhasil dikirim ke halaman absensi.","success");
    stop();
    setTimeout(function(){window.close()},600);
  }else{
    setStatus("Halaman utama absensi tidak ditemukan. Jangan tutup halaman utama.","warning");
  }
}

function kirimError(message){
  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({
        type:"ABSEN_CAMERA_ERROR",
        message:message
      },"*");
    }
  }catch(e){}
}

function errorMessage(e){
  if(e && (e.name==="NotAllowedError" || e.name==="PermissionDeniedError"))
    return "Izin Kamera ditolak. Pilih Izinkan pada popup kamera browser atau ubah izin Kamera situs menjadi Izinkan.";
  if(e && (e.name==="NotFoundError" || e.name==="DevicesNotFoundError"))
    return "Kamera tidak ditemukan.";
  if(e && (e.name==="NotReadableError" || e.name==="TrackStartError"))
    return "Kamera sedang digunakan aplikasi lain.";
  if(e && e.name==="SecurityError")
    return "Browser memblokir kamera karena keamanan. Pastikan URL halaman ini HTTPS.";
  return e && e.message ? e.message : "Kamera tidak dapat dibuka.";
}

function setStatus(text,type){
  const el=document.getElementById("status");
  el.textContent=text;
  el.className="status"+(type?" "+type:"");
}

function stop(){
  if(stream){
    stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});
    stream=null;
  }
  const video=document.getElementById("video");
  if(video) video.srcObject=null;
}

function tutup(){
  stop();
  try{window.close()}catch(e){}
}
</script>
</body>
</html>
